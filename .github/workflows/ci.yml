name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: helm
          POSTGRES_PASSWORD: helm
          POSTGRES_DB: helm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U helm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Routes that open their own `session_scope()` read DATABASE_URL directly;
      # the tests' own fixtures use TEST_DATABASE_URL. Point both at the CI
      # pgvector/pg16 service so integration tests exercise both paths.
      DATABASE_URL: postgresql+asyncpg://helm:helm@localhost:5432/helm_test
      TEST_DATABASE_URL: postgresql+asyncpg://helm:helm@localhost:5432/helm_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        working-directory: apps/api
        run: uv run ruff check .

      - name: Format check (ruff)
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: Typecheck (mypy)
        working-directory: apps/api
        run: uv run mypy helm

      - name: Run migrations against test DB
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://helm:helm@localhost:5432/helm_test
        run: uv run alembic upgrade head

      - name: Tests (pytest)
        working-directory: apps/api
        run: uv run pytest -q

  web:
    name: Web (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
