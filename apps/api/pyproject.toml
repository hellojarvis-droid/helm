[project]
name = "helm-api"
version = "0.0.0"
description = "Helm API — FastAPI backend + agent orchestration"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pgvector>=0.3.6",
  "httpx>=0.28.1",
  "structlog>=24.4.0",
  "sentry-sdk[fastapi]>=2.19.2",
  "pyjwt[crypto]>=2.10.1",
  "redis>=5.2.1",
  "python-multipart>=0.0.20",
  "langfuse>=2.56.0",
  "anthropic>=0.40.0",
  "composio>=0.8.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.1",
  "pytest-httpx>=0.35.0",
  "aiosqlite>=0.20.0",
  "ruff>=0.8.4",
  "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["helm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
