[package]
name = "helm-desktop"
version = "0.0.0"
description = "Helm desktop — Tauri shell around the web app, plus computer-use hooks."
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# No production-release-specific features yet; kept for parity with
# Tauri defaults so `cargo tauri build --release` picks them up cleanly.
custom-protocol = ["tauri/custom-protocol"]
