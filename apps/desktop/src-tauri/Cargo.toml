[package]
name = "helm-desktop"
version = "0.0.0"
description = "Helm desktop — Tauri shell around the web app, plus computer-use hooks."
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Phase 6: the computer-use runner needs an HTTP client, an async runtime,
# and a stable device id for the /claim contract.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "sync", "time", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"

[features]
# No production-release-specific features yet; kept for parity with
# Tauri defaults so `cargo tauri build --release` picks them up cleanly.
custom-protocol = ["tauri/custom-protocol"]
